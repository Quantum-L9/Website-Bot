version: 2
updates:
  # Root npm project
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    # Namespaced CI-routing labels (l9-ci-core taxonomy). Dependabot PRs are
    # advisory by governance policy; deprecated plain `dependencies` label dropped.
    labels: ['automation:dependabot', 'type:deps', 'risk:advisory']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']
      # Biome version is Core-owned (presets/typescript/biome.json $schema).
      - dependency-name: '@biomejs/biome'

  # GitHub Actions used by workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
    labels: ['automation:dependabot', 'automation:github-actions', 'type:deps', 'risk:advisory']
