name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  # No l9-ci-core caller lives here (l9-ci-sdk ADR-0016). Organization
  # analysis is the org ruleset's Core main org-ci.yml (required check
  # "Analyze (central Core)"); lint and tsc run in l9-lint-test.yml and
  # l9-lint-test-node.yml.
  #
  # Gate 5 analogue of SEO-Bot's live Postgres + Redis job on ci.yml.
  # Website-Bot has no compose plane: better-sqlite3 is in-process.
  # Factory-local tests that actually open SQLite and assemble a site live
  # in `site:test:local` and `pipeline:plan`; this job is what makes a green
  # `CI` check mean the factory ran under this workflow name.
  # `run-site-factory-tests.mjs` already fail-closes on an empty file list
  # (same skip-killer as SEO-Bot LIVE_SERVICES_REQUIRED=1).
  gate5:
    name: Gate 5 — site-factory local (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@quantum-l9'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts && npm rebuild better-sqlite3
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: DomainSpec semantic conservation
        run: npm run normalize-spec:check
      # rendered-site-validation renders every built route in headless Chromium
      # (tests/integration/local/rendered-site-browser.test.ts). A missing
      # browser is a gate failure, not a skip, so the binary is provisioned here.
      - name: Install Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Gate 5 factory-local suite
        run: |
          npm run site:test:local
          npm run pipeline:plan
        env:
          NODE_ENV: test
          # Keeps the visual regression captures, expected/actual/diff PNGs
          # and reports so a failure can be inspected after the run.
          WB_VISUAL_EVIDENCE_DIR: ${{ runner.temp }}/wb-visual-evidence
      - name: Upload visual regression evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wb-visual-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wb-visual-evidence
          if-no-files-found: warn
          retention-days: 14
      # Real generated source -> astro check -> astro build -> headless browser
      # render of every route. A template astro cannot parse (e.g. a comment
      # ahead of the frontmatter fence) passes the structural suite above but
      # fails here, so this runs on every PR rather than only on demand.
      - name: Real generated Astro build and browser validation
        run: npm run site:validate:build
        env:
          NODE_ENV: test
