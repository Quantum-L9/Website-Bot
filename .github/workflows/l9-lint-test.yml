# L9 Consumer Lint + Test — TypeScript Preset (LOCKED STRUCTURE)
#
# DO NOT EDIT workflow structure — only the env: block is consumer-configurable.
# Managed by l9-ci-core presets/typescript.
#
# Conventions:
#   - Immutable event-revision checkout (no floating action ref)
#   - SHA-pinned external actions
#   - Least privilege (contents: read only)
name: L9 Lint and Test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# ── CONFIGURABLE: agent sets these during activation ───────────────────────────
env:
  NODE_VERSION: "20"
  PACKAGE_MANAGER: "npm"
  SOURCE_DIR: "src/"
  HAS_TYPESCRIPT: "true"

permissions:
  contents: read

concurrency:
  group: l9-lint-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ env.PACKAGE_MANAGER }}
          registry-url: https://npm.pkg.github.com
          scope: '@quantum-l9'

      - name: Install dependencies
        run: |
          set -euo pipefail
          # Lifecycle scripts stay off: this step runs with a registry token in
          # NODE_AUTH_TOKEN, so a dependency postinstall would execute with it
          # in reach (githubactions:S6505). A lockfile is required rather than
          # optional so the installed versions are the reviewed ones and an
          # accidentally deleted lockfile fails loudly instead of silently
          # resolving fresh releases (githubactions:S8543).
          case "${PACKAGE_MANAGER}" in
            npm)
              [ -f package-lock.json ] || { echo "::error::package-lock.json is required for a reproducible install"; exit 1; }
              npm ci --ignore-scripts ;;
            pnpm)
              corepack enable
              [ -f pnpm-lock.yaml ] || { echo "::error::pnpm-lock.yaml is required for a reproducible install"; exit 1; }
              pnpm install --frozen-lockfile --ignore-scripts ;;
            yarn)
              corepack enable
              [ -f yarn.lock ] || { echo "::error::yarn.lock is required for a reproducible install"; exit 1; }
              YARN_ENABLE_SCRIPTS=false yarn install --frozen-lockfile ;;
            *) echo "::error::unknown PACKAGE_MANAGER ${PACKAGE_MANAGER}" && exit 1 ;;
          esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: eslint
        run: |
          set -euo pipefail
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.lint ? 0 : 1)" 2>/dev/null; then
            ${PACKAGE_MANAGER} run lint
          elif [ -x node_modules/.bin/eslint ]; then
            # Local binary only. `npx --yes` would install and run an unpinned
            # eslint plus its lifecycle scripts on demand (githubactions:S6505).
            node_modules/.bin/eslint "${SOURCE_DIR}" --max-warnings=0
          else
            echo "::error::no lint script and no local eslint; add a lint script or declare eslint in devDependencies"
            exit 1
          fi

      - name: tsc --noEmit
        if: env.HAS_TYPESCRIPT == 'true'
        run: |
          set -euo pipefail
          if [ ! -f tsconfig.json ]; then
            echo "::notice::no tsconfig.json found, skipping type check"
            exit 0
          fi
          # Use the typescript resolved by the lockfile above. `npx --yes` would
          # fetch and run an unpinned package on demand (githubactions:S6505).
          if [ ! -x node_modules/.bin/tsc ]; then
            echo "::error::HAS_TYPESCRIPT=true but typescript is not a declared dependency; add it to devDependencies"
            exit 1
          fi
          node_modules/.bin/tsc --noEmit -p tsconfig.json

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ env.PACKAGE_MANAGER }}
          registry-url: https://npm.pkg.github.com
          scope: '@quantum-l9'

      - name: Install dependencies
        run: |
          set -euo pipefail
          # Lifecycle scripts stay off: this step runs with a registry token in
          # NODE_AUTH_TOKEN, so a dependency postinstall would execute with it
          # in reach (githubactions:S6505). A lockfile is required rather than
          # optional so the installed versions are the reviewed ones and an
          # accidentally deleted lockfile fails loudly instead of silently
          # resolving fresh releases (githubactions:S8543).
          case "${PACKAGE_MANAGER}" in
            npm)
              [ -f package-lock.json ] || { echo "::error::package-lock.json is required for a reproducible install"; exit 1; }
              npm ci --ignore-scripts ;;
            pnpm)
              corepack enable
              [ -f pnpm-lock.yaml ] || { echo "::error::pnpm-lock.yaml is required for a reproducible install"; exit 1; }
              pnpm install --frozen-lockfile --ignore-scripts ;;
            yarn)
              corepack enable
              [ -f yarn.lock ] || { echo "::error::yarn.lock is required for a reproducible install"; exit 1; }
              YARN_ENABLE_SCRIPTS=false yarn install --frozen-lockfile ;;
            *) echo "::error::unknown PACKAGE_MANAGER ${PACKAGE_MANAGER}" && exit 1 ;;
          esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run test suite
        env:
          CI: "true"
        run: |
          set -euo pipefail
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.test ? 0 : 1)" 2>/dev/null; then
            ${PACKAGE_MANAGER} test
          else
            echo "::notice::no test script defined in package.json, skipping"
          fi
