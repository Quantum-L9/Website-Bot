# L9_META: layer=configuration, role=diagnostic, status=active, version=1.0.0
# Live org-secret resolution doctor. Maps every secret/var the pipeline uses and
# runs scripts/verify-secrets-live.mjs, which confirms each RESOLVES in this repo's
# Actions context and, where a cheap/safe endpoint exists, AUTHENTICATES.
# Never prints secret values; never calls the Vercel deploy hook; no SQL is run.
name: Secrets Doctor (live resolution)

on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Fail the job if a REQUIRED secret is missing/invalid'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: secrets-doctor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Live secret resolution check
        run: node scripts/verify-secrets-live.mjs ${{ inputs.strict && '--strict' || '' }}
        env:
          # LLM / content
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          # Deploy / Vercel
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          SEO_BOT_SITE_VERCEL_DEPLOY_HOOK: ${{ secrets.SEO_BOT_SITE_VERCEL_DEPLOY_HOOK }}
          # GitHub publish / provision tokens
          GITHUB_SITE_TOKEN: ${{ secrets.GITHUB_SITE_TOKEN }}
          GITHUB_PROVISION_TOKEN: ${{ secrets.GITHUB_PROVISION_TOKEN }}
          SEO_BOT_SITE_GITHUB_TOKEN: ${{ secrets.SEO_BOT_SITE_GITHUB_TOKEN }}
          # SEO
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          SEO_BOT_URL: ${{ secrets.SEO_BOT_URL }}
          SEO_BOT_API_KEY: ${{ secrets.SEO_BOT_API_KEY }}
          # Analytics
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          # Data / eventing
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
          INNGEST_SIGNING_KEY: ${{ secrets.INNGEST_SIGNING_KEY }}
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
          # Client identity (vars)
          CLIENT_ID: ${{ vars.CLIENT_ID }}
          CLIENT_PUBLIC_SITE_URL: ${{ vars.CLIENT_PUBLIC_SITE_URL }}
