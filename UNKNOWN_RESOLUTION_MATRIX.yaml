unknown_resolution_matrix:
  license_choice:
    resolution_type: committed_config
    value_source: config/launch-env.values.yaml
    env_vars_added: [PROJECT_LICENSE, LICENSE_CHOICE_REQUIRED]
    launch_gate: "factory MVP requires PROJECT_LICENSE"
    remaining_operator_action: "Change PROJECT_LICENSE in config/launch-env.values.yaml if the factory license changes."
  support_contact:
    resolution_type: committed_config
    value_source: [SUPPORT.md, config/launch-env.values.yaml]
    env_vars_added: [SUPPORT_CONTACT_EMAIL, SUPPORT_CONTACT_URL]
    launch_gate: "factory MVP requires support contact"
    remaining_operator_action: "Update SUPPORT.md and config/launch-env.values.yaml if the operator contact changes."
  security_contact:
    resolution_type: committed_config
    value_source: [SECURITY.md, config/launch-env.values.yaml]
    env_vars_added: [SECURITY_CONTACT_EMAIL, SECURITY_DISCLOSURE_URL]
    launch_gate: "factory MVP requires security contact"
    remaining_operator_action: "Update SECURITY.md and config/launch-env.values.yaml if the security contact changes."
  final_production_domain_verification:
    resolution_type: deferred_client_launch
    value_source: operator_and_runtime_check
    env_vars_added: [PUBLIC_SITE_URL, PRODUCTION_DOMAIN, DOMAIN_VERIFICATION_REQUIRED]
    launch_gate: "enforced only with --client-launch / LAUNCH_PHASE=client_production"
    remaining_operator_action: "Configure and verify production domain for the first complete client site."
  real_form_endpoint:
    resolution_type: deferred_client_launch
    value_source: operator
    env_vars_added: [FORM_PROVIDER, FORM_ENDPOINT_URL, FORM_WEBHOOK_SECRET, LEAD_NOTIFICATION_EMAIL]
    launch_gate: "MVP default FORM_PROVIDER=none; endpoint/secret required only when form is claimed or --client-launch"
    remaining_operator_action: "Provide lead endpoint when a client form provider is selected."
  crm_credentials:
    resolution_type: deferred_mvp
    value_source: operator_secret
    env_vars_added: [CRM_PROVIDER, CRM_API_BASE_URL, CRM_CLIENT_ID, CRM_CLIENT_SECRET, CRM_API_TOKEN, CRM_TEST_MODE]
    launch_gate: "CRM claim blocked until CRM_PROVIDER is set and not none — not a factory MVP blocker"
    remaining_operator_action: "Select CRM provider after MVP; provide credentials only then."
  analytics_provider_id:
    resolution_type: deferred_mvp
    value_source: operator
    env_vars_added: [ANALYTICS_PROVIDER, ANALYTICS_MEASUREMENT_ID, ANALYTICS_CONVERSION_EVENT, ANALYTICS_THANK_YOU_EVENT]
    launch_gate: "analytics claim blocked until provider claimed — not a factory MVP blocker"
    remaining_operator_action: "Provide analytics config when claimed."
  vercel_project_org_token:
    resolution_type: split_identity
    value_source: [Infisical/AWS for VERCEL_TOKEN, config/launch-env.values.yaml for VERCEL_TEAM_ID, DomainSpec for per-client project]
    env_vars_added: [VERCEL_TEAM_ID, VERCEL_TOKEN, CLIENT_VERCEL_PROJECT_ID, CLIENT_VERCEL_DEPLOY_HOOK]
    launch_gate: "factory needs VERCEL_TOKEN + VERCEL_TEAM_ID; per-client project identity at provision/deploy time"
    remaining_operator_action: "Keep Infisical hydrated; set per-client deploy.vercel_project_id in DomainSpec."
  approved_legal_disclaimer:
    resolution_type: deferred_client_launch
    value_source: examples/*/DRAFT_LEGAL_DISCLAIMER.md
    env_vars_added: [LEGAL_DISCLAIMER_APPROVED, LEGAL_DISCLAIMER_VERSION, LEGAL_REVIEW_OWNER]
    launch_gate: "enforced only with --client-launch"
    remaining_operator_action: "Review and approve disclaimer for the client site before production claim."
  professional_license_number:
    resolution_type: env_required_when_display
    value_source: operator
    env_vars_added: [PROFESSIONAL_LICENSE_NUMBER, PROFESSIONAL_LICENSE_STATE, PROFESSIONAL_LICENSE_TYPE, LICENSE_DISPLAY_REQUIRED]
    launch_gate: "only when LICENSE_DISPLAY_REQUIRED=true"
    remaining_operator_action: "Provide professional license number/state/type when the vertical requires display."
