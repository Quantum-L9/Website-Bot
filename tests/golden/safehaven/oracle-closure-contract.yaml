# =====================================================================
# ACCEPTANCE / TERMINAL GATES
# =====================================================================

acceptance:

  oracle_implementation_complete_requires:
    blocking_properties_total: 101
    blocking_properties_enforced: 101
    coverage_pct: 100
    stale_citations: 0
    remaining_unenforced: 0

  calibration_requires:
    positive_control_pass: true
    negative_controls_run: 25
    negative_controls_rejected: 25
    false_acceptance_count: 0
    deterministic_replay_pass: true

  NC11_requires:
    product_producer_fixed: true
    oracle_negative_control_rejected: true

  golden_e2e_authorization_requires:
    oracle_implementation_complete: true
    calibration_complete: true
    material_UNKNOWN_count: 0

failure_behavior:

  missing_required_evidence:
    action: FAIL
    rule: do_not_default_missing_numeric_values_to_zero

  material_unknown:
    action: HALT_BRANCH
    label: UNKNOWN

  oracle_coverage_less_than_100:
    action: PROHIBIT_REAL_GOLDEN_RUN
    code: ORACLE_IMPLEMENTATION_INCOMPLETE

  positive_control_rejected:
    action: PROHIBIT_REAL_GOLDEN_RUN
    code: ORACLE_FALSE_REJECTION

  negative_control_accepted:
    action: PROHIBIT_REAL_GOLDEN_RUN
    code: ORACLE_FALSE_ACCEPTANCE

  visual_inconclusive:
    action: PROHIBIT_GOLDEN_E2E_PASS_IMPROVED
    code: GOLDEN_ORACLE_BLOCKING_INCONCLUSIVE

final_verdict_rules:

  GOLDEN_E2E_PASS_IMPROVED:
    requires:
      - all 101 blocking properties pass
      - no hard gate failures
      - no blocking inconclusive state
      - rendered visual QA executed
      - visual oracle passes
      - no missing required evidence

  STRUCTURAL_E2E_PASS_VISUAL_UNPROVEN:
    meaning: >
      Structural/product gates passed but visual improvement cannot be
      established conclusively.
    counts_as_golden_pass: false

  GOLDEN_E2E_FAIL:
    requires_any:
      - hard gate failure
      - prohibited product authority
      - invalid lineage
      - unsupported business truth
      - asset-policy violation
      - route integrity failure
      - visual regression hard gate
      - missing evidence treated as hard failure

terminal_state:
  current_snapshot: ORACLE_IMPLEMENTATION_INCOMPLETE
  target: ORACLE_IMPLEMENTATION_COMPLETE
  real_golden_e2e_allowed_before_target: false
