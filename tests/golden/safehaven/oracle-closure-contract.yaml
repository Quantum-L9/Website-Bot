schema: l9.golden-oracle-complete/v1

oracle:
  id: safehaven-redesign-oracle-v1
  normative_authority: oracle.json
  enumeration_authority: oracle-coverage.json
  implementation_snapshot_authority: ORACLE_COVERAGE_AUDIT.md

philosophy:
  command_success_is_evidence: false
  missing_evidence_is_failure: true
  inconclusive_is_pass: false
  structural_pass_can_claim_visual_improvement: false
  self_certification_allowed: false

coverage_snapshot:
  blocking_properties_total: 101
  enforced_total: 62
  unenforced_total: 39
  hardcoded_within_enforced: 2
  coverage_pct: 61.4
  stale_citations: 0
  verdict: ORACLE_IMPLEMENTATION_INCOMPLETE

status_semantics:
  ENFORCED:
    meaning: counted among historical 62 enforced properties
  UNENFORCED:
    meaning: counted among historical 39 unenforced properties
  ENFORCED_BUT_HARDCODED:
    meaning: >
      Counted among historical 62, but implementation duplicated oracle
      configuration instead of reading oracle.json dynamically.

global_invariants:
  - oracle.json is normative authority
  - missing required evidence fails closed
  - UNKNOWN cannot satisfy a blocking property
  - command exit code cannot override a failed property
  - structural success cannot assert visual improvement
  - visual inconclusive state cannot produce GOLDEN_E2E_PASS_IMPROVED
  - deterministic verification must not invoke an LLM
  - cross-process execution facts cannot be fabricated by Website-Bot
  - oracle-configured lists and thresholds must be read dynamically
  - all blocking properties must be evaluated before final PASS

