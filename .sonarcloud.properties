# SonarQube Cloud automatic-analysis configuration.
#
# This repository is analyzed by automatic analysis (no CI scanner step), which
# reads THIS file and ignores sonar-project.properties. Settings here override
# the equivalents in Administration > General Settings > Analysis Scope.
#
# Only captured evidence is excluded. Every directory below holds dated,
# immutable output of a past run — build-emitted HTML, receipts, probe scripts
# copied in alongside them — kept so a later run can be compared against it.
# They are records, not maintained source: editing one to satisfy a rule would
# falsify the artifact it exists to preserve, and the finding would be about
# generated markup no one authors. The generators themselves stay in scope, so
# a real defect in emitted HTML is still reported — against the code that emits
# it, where it can actually be fixed.
#
# This is not a place to park findings in hand-written code. Anything under
# src/, scripts/, packages/, astro_template/, examples/, or .github/ is in
# scope and stays in scope.

sonar.exclusions=docs/reports_and_test_results/**/*, reports/test-runs/**/*
