# L9_META: layer=configuration, role=benchmark_input, status=active, version=1.0.0
# Flat DomainSpec for the Quantum AI Partners clean capability test.
#
# TEST-PURITY NOTE: this spec carries ONLY raw first-party input.
#   - client_vision fields contain the client's own words (likes, dislikes,
#     requirements, avoids). No design tokens, no chosen colors/fonts, no
#     derived design principles.
#   - design_references carry the client's verbatim feedback as
#     selection_reason. `principles` are intentionally OMITTED: translating
#     reference characteristics is Website-Bot's job, not the operator's.
#   - design.status is `pending`: Website-Bot must resolve the design itself.
#   - geography is a required pipeline field; the client supplied no region,
#     so the least specific value ("US" national service area) is used. This
#     is a build-context assumption, not a business-truth claim.
