      - GATE 0–6 verdicts and residual Unknowns/risks are explicit.
      - Controller recommends but does not declare a terminal verdict.
    failure_effect: Terminal verdict remains INCONCLUSIVE.

scheduler:
  objective_order:
    - unblock_critical_path
    - complete_authority_and_producer_lock
    - execute_ready_reversible_website_bot_work
    - preserve_independent_verification
    - never_start_next_push_on_failed_gate
    - close_out_with_complete_evidence
  one_writer_per_repository: true
  non_mutating_cross_repository_tasks_allowed: true
  mutating_cross_repository_tasks_forbidden: true
  seo_bot_mutation: forbidden
  initial_max_workers: 1
  maximum_workers_without_new_authorization: 2
  blocked_task_behavior: >
    Block only the affected task or subgraph, continue unrelated ready work,
    and include the blocker in the next program digest.

retry_policy:
  max_attempts: 2
  retryable:
    - worker_timeout
    - worker_crash
    - temporary_file_lock
    - transient_test_infrastructure
    - temporary_adapter_failure
    - temporary_seo_bot_reachability_failure
  non_retryable:
    - deterministic_test_failure
    - scope_violation
    - secret_access_attempt
    - stale_base_revision
    - semantic_unknown
    - shared_contract_collision
    - implementer_self_verification
    - seo_bot_source_mutation
    - fabricated_baseline
    - forbidden_command
    - more_than_one_automatic_repair
  preserve_every_attempt: true
  require_new_source_contract_when:
    - accepted_objective_changes
    - materially_authorized_target_set_changes
    - authorization_ceiling_changes
