    owner_authority_id: AUTH-005
    task_ids: [TASK-001]
    required_evidence_ids: [EVID-001, EVID-002, EVID-003]
    validation_pack_gate: GATE_0
    pass_criteria:
      - Campaign source preserved and digest-bound.
      - Native Blueprint validates in template mode.
      - Website-Bot and SEO-Bot full SHAs are real captured values.
      - Shared lock and bot-interop digests are recorded.
      - Validation Pack GATE 0 is PASS, or BLOCKED_BY_ENVIRONMENT with structural producer proof and no implementation defect disguised as environment.
      - SEO-Bot worktree was not mutated.
    failure_effect: Block Controller task admission for W1+.
  - id: GATE-002
    name: push_1_real_transaction
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-005
    task_ids: [TASK-002]
    required_evidence_ids: [EVID-005]
    validation_pack_gate: GATE_1
    pass_criteria:
      - One canonical SeoBuildIntelligencePort adapter exists.
      - One no-mock transaction completed with exact lineage.
      - Zero Website-Bot generic final-copy fallback invocations.
      - Seam probe is not imported by production paths.
      - Validation Pack GATE 1 is PASS.
    failure_effect: Block Push 2.
  - id: GATE-003
    name: push_2_donor_intelligence
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-005
    task_ids: [TASK-003]
    required_evidence_ids: [EVID-006]
    validation_pack_gate: GATE_2
    pass_criteria:
      - CompetitiveLandscape is the sole donor authority.
      - Real WebsiteBuildBlueprint is sealed with exact landscape lineage.
      - Validation Pack GATE 2 is PASS.
    failure_effect: Block Push 3.
  - id: GATE-004
    name: push_3_production_convergence
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-005
    task_ids: [TASK-004]
    required_evidence_ids: [EVID-007]
    validation_pack_gate: GATE_3
    pass_criteria:
      - Real WebsiteBuildBlueprint replaced the seam probe.
      - Deterministic compiler is the only reconciliation authority.
      - Production StructuredContentPackage is the exclusive prose authority.
      - Validation Pack GATE 3 is PASS.
    failure_effect: Block Push 4.
  - id: GATE-005
    name: push_4_assembly_and_build
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-005
    task_ids: [TASK-005]
    required_evidence_ids: [EVID-008]
    validation_pack_gate: GATE_4
    pass_criteria:
      - One real candidate builds.
      - Blueprint Conformance Report PASSes.
      - Representative screenshots exist.
      - Build success is not recorded as improvement proof.
      - Validation Pack GATE 4 is PASS.
    failure_effect: Block Push 5.
  - id: GATE-006
    name: push_5_improvement_and_golden_run
