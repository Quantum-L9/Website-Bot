decisions:
  - id: DEC-001
    question: May this campaign mutate SEO-Bot source to make Website-Bot integrate?
    authority_id: AUTH-001
    status: accepted
    options:
      - id: A
        description: SEO-Bot is read-only. Shared-contract collisions stop and require a separate program.
      - id: B
        description: Website-Bot workers may patch SEO-Bot to pass gates.
    recommended_option_id: A
    selected_option_id: A
    blocking_task_ids: []
    required_evidence_ids: []
  - id: DEC-002
    question: What WebsiteBuildBlueprint is legal in Push 1?
    authority_id: AUTH-004
    status: accepted
    options:
      - id: A
        description: Integration-only seam probe, prohibited from production design/build imports.
      - id: B
        description: Invent a production WebsiteBuildBlueprint during Push 1.
    recommended_option_id: A
    selected_option_id: A
    blocking_task_ids: []
    required_evidence_ids: [EVID-002]
  - id: DEC-003
    question: Who may issue push-gate verdicts?
    authority_id: AUTH-005
    status: accepted
    options:
      - id: A
        description: Independent verifier using the Validation Contract Pack. Implementer claims are not verdicts.
      - id: B
        description: The implementing worker marks its own push PASS.
    recommended_option_id: A
    selected_option_id: A
    blocking_task_ids: []
    required_evidence_ids: []
  - id: DEC-004
    question: Does a successful candidate build prove the website improved?
    authority_id: AUTH-001
    status: accepted
    options:
      - id: A
        description: No. Improvement is proven only by QualityDeltaReport + GATE 5/6.
      - id: B
        description: Yes. Build success is sufficient.
    recommended_option_id: A
    selected_option_id: A
    blocking_task_ids: []
    required_evidence_ids: []
  - id: DEC-005
    question: How many automatic repair cycles are authorized in Push 5?
    authority_id: AUTH-001
    status: accepted
    options:
      - id: A
        description: At most one targeted automatic repair cycle. Persistent second failure is terminal.
      - id: B
        description: Continuous autonomous repair until quality passes.
    recommended_option_id: A
    selected_option_id: A
    blocking_task_ids: []
    required_evidence_ids: []

