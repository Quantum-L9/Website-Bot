operator_directive:
  objective: >
    Build and prove the accepted five-push Website-Bot sequence through the
    Program Execution pipeline.

    Push 1 proves transport. Push 2 proves intelligence. Push 3 proves
    contractual convergence. Push 4 proves construction. Push 5 proves
    improvement. Each push has its own preflight, mutation envelope, rollback,
    DAG, adversarial evidence matrix, and independent validation gate.

    Do not redesign the sequence. Compile Program1.md into Blueprint Task Cards
    and execute them. Use the Independent Validation Contract Pack as the
    verifier contract after every implementation slice. The verifier is not
    the implementer.
  mode: controlled_autonomous_until_material_boundary
  auto_continue:
    - read_only_inspection
    - blueprint_materialization
    - evidence_collection
    - evidence_determined_unknown_resolution
    - reversible_website_bot_repo_local_work
    - deterministic_local_validation
    - independent_verification
    - bounded_retry_of_transient_failures
    - unrelated_ready_work_when_one_subgraph_is_blocked
  pause_only_for:
    - missing_or_conflicting_semantic_authority
    - shared_contract_collision
    - material_scope_expansion
    - stale_or_invalid_program_lock
    - unresolved_blocking_unknown
    - failed_blocking_gate
    - security_or_secret_boundary
    - seo_bot_source_mutation_requested
    - exact_remote_mutation_approval
    - exact_merge_tag_release_publish_deploy_or_migration_approval
    - exact_destructive_action_approval
    - representative_source_site_unresolved
  prohibited_actions:
    - push
    - pull_request
    - merge
    - publish
    - release
    - deploy
    - migrate_production
    - destructive_operations
    - external_messages
    - modify_seo_bot_source
    - duplicate_bot_interop_types
    - website_bot_generic_final_copy_fallback
    - llm_merge_of_blueprints
    - treat_build_success_as_improvement
    - more_than_one_automatic_repair_cycle
    - fabricate_baseline_shas

program:
  id: website-bot-five-push-v1
  name: Website-Bot Five-Push Intelligence Transaction
  version: 1.0.0
  owner: Igor Beylin
  definition_status: draft
  snapshot_at: "2026-08-14"
  objective: >
    Prove a real, cryptographically traceable, fail-closed Website-Bot ↔
    SEO-Bot redesign transaction from CompetitiveLandscape through a
    release-ready candidate, without provider leakage, duplicate wire
    contracts, generic Website-Bot content fallback, or treating a successful
    build as product success.
  problem_statement: >
    Website-Bot and SEO-Bot were specified as independent authorities that
    must cooperate through l9.website-intelligence/v1. Informal "if it works,
    continue" execution lets mocked seams, lineage drift, and a successful
    but worse website pass as done. The accepted five-push sequence plus the
    independent validation pack exist as prose plans; they are not yet a
    Program Execution campaign an agent can admit, lock, execute, and verify.
  target_state: >
    GATE 0 PASSes on real SEO-Bot producers. Push 1 completes one no-mock
    CompetitiveLandscape → SEOContentBlueprint → sealed PageContentContract →
    StructuredContentPackage transaction. Push 2 seals a real
    WebsiteBuildBlueprint from the exact CompetitiveLandscape donor cohort.
    Push 3 replaces the seam probe with production authorities. Push 4 builds
    one real candidate that conforms to those authorities. Push 5 emits a
    QualityDeltaReport, bounds repair to one cycle, and completes one no-mock
    golden run whose release-readiness gate returns YES. Controller handoff
    recommends a terminal verdict; the program owner declares it.
  scope:
    include:
      - Website-Bot SeoBuildIntelligencePort and one canonical HTTP adapter
      - real SEO-Bot CompetitiveLandscape / SEOContentBlueprint / StructuredContentPackage consumption
      - integration-only WebsiteBuildBlueprint seam probe (Push 1 only)
      - bounded CompetitorIngestion, pattern harvest, PatternPortfolio, gap analysis
      - real WebsiteBuildBlueprint generation and seal
      - deterministic PageContentContract compiler as sole reconciliation authority
      - production authority wiring into BuildContext
      - DesignIntelligence, ImageAssetPlanning, SiteAssembler, deterministic schema.org
      - one real candidate site build plus screenshots
      - QualityDeltaReport, one bounded repair cycle, release-readiness gate
      - one no-mock full-system golden run
      - independent validation pack Gates 0–6
    exclude:
      - SEO-Bot source changes
      - LLM-Router source changes
      - shared protocol / @quantum-l9/bot-interop schema redesign
      - Copy Mode / second competitor authority
      - deployment, release, publish, production cutover
      - continuous autonomous repair
      - more than one automatic repair cycle
      - post-golden-run optimization and additional niches
      - Cursor-Governance PE core/adapter/conformance mutation
  contracts:
    pair: program-execution-system.v2
    blueprint: program-execution-blueprint.v2
    controller_minimum: program-execution-controller.v2
    domain:
      - l9.website-intelligence/v1
      - WEBSITE_INTELLIGENCE_LOCK.json
      - "@quantum-l9/bot-interop"
      - canonical.schema.plan_document.v1
  planning_lineage:
    push_1: website-bot.push-1.real-seo-transaction.v1
    push_2: website-bot.push-2.donor-intelligence.v1
    push_3: website-bot.push-3.blueprint-convergence.v1
    push_4: website-bot.push-4.assembly-build.v1
    push_5: website-bot.push-5.quality-delta-golden-proof.v1
  authority_order:
    - applicable_safety_legal_security_requirements
    - cursor_governance_canonical_law
    - program_execution_v2_interface_contract
    - latest_explicit_operator_instruction
    - this_immutable_campaign_source
    - Program1.md_per_push_execution_contracts
    - independent_validation_contract_pack
    - l9.website-intelligence/v1_and_bot_interop
    - verified_current_state_evidence
    - approved_task_card
    - exact_rendered_source_contract
    - repository_local_governance
    - implementation
    - documentation
    - historical_material
    - UNKNOWN
  operating_rules:
    - one_authority_per_responsibility
    - controller_may_narrow_never_widen
    - unknown_blocks_only_named_dependencies
    - promotion_requires_evidence_backed_gates
    - no_silent_scope_expansion
    - worker_claim_is_not_verification
    - verifier_is_not_the_implementer
    - next_push_requires_prior_gate_pass
    - passing_unit_tests_are_not_integration_proof
    - mocked_artifacts_are_not_cross_repo_proof
    - http_200_is_not_lineage_proof
    - successful_build_is_not_improvement_proof
    - do_not_fabricate_baseline_shas
    - seo_bot_is_read_only
    - website_bot_owns_experience_structure
    - seo_bot_owns_search_content_and_final_prose
    - deterministic_compiler_is_sole_reconciliation_authority
    - runtime_state_remains_outside_source_and_target_worktrees
    - no_irreversible_action_without_exact_authority
  terminal_verdicts:
    - CONVERGED
    - CONVERGED_WITH_NON_BLOCKING_RISKS
    - NOT_CONVERGED
    - INCONCLUSIVE

