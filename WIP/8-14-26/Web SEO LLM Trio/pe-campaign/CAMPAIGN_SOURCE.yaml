prohibited_paths:
  - id: DNB-001
    statement: Do not modify SEO-Bot source, LLM-Router, or published bot-interop schema semantics.
    rationale: DEC-001. Collisions require a separate program.
  - id: DNB-002
    statement: Do not fabricate baseline SHAs or artifact hashes.
    rationale: Program1 is preflight_blocked until real values are captured.
  - id: DNB-003
    statement: Do not treat worker completion, unit tests, mocks, or HTTP 200 as independent verification.
    rationale: Validation pack doctrine.
  - id: DNB-004
    statement: Do not import the Push-1 seam probe into production Website-Bot design/build paths.
    rationale: Real WebsiteBuildBlueprint is a Push-2 product.
  - id: DNB-005
    statement: Do not generate Website-Bot generic final copy as SEO-Bot fallback.
    rationale: Fail closed. SEO-Bot owns final prose.
  - id: DNB-006
    statement: Do not let an LLM merge WebsiteBuildBlueprint and SEOContentBlueprint.
    rationale: Deterministic compiler is the only reconciliation authority.
  - id: DNB-007
    statement: Do not start the next push with a failed or unverified prior gate.
    rationale: Validation pack promotion law.
  - id: DNB-008
    statement: Do not deploy, release, publish, or cut over production.
    rationale: This program proves a candidate, not a launch.
  - id: DNB-009
    statement: Do not run more than one automatic repair cycle.
    rationale: DEC-005. Persistent second failure is terminal.
  - id: DNB-010
    statement: Do not place mutable PE runtime state in Website-Bot, SEO-Bot, or Cursor-Governance worktrees.
    rationale: Runtime belongs under $HOME/.l9/programs/website-bot-five-push-v1.
  - id: DNB-011
    statement: Do not mutate Cursor-Governance Program Execution core/adapters/conformance for this product campaign.
    rationale: This campaign consumes PE; it does not extend PE.
  - id: DNB-012
    statement: Do not expose credentials in receipts, logs, or chat.
    rationale: Validation pack and secret-boundary pause.

