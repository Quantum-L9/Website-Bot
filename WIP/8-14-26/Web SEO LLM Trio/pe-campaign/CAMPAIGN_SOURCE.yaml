      - Blocking dimensions are IMPROVED or NON_REGRESSED, or visual non-regressions are evidence-supported.
      - Automatic repair ran at most once.
      - Release-readiness is YES.
      - One no-mock golden run succeeded.
      - Validation Pack GATE 5 and GATE 6 are PASS.
    failure_effect: Block handoff as success.
  - id: GATE-007
    name: controller_handoff
    gate_type: convergence
    blocking: true
    owner_authority_id: AUTH-001
