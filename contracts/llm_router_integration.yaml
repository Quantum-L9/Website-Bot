# ═══════════════════════════════════════════════════════════════
# L9 Website Factory → LLM Provider Integration Contract
# ═══════════════════════════════════════════════════════════════
# v2.0.0 (ADR-0020) supersedes v1.1.1, which bound every operation
# to @quantum-l9/llm-router (OpenRouter + Perplexity). The file path
# is kept stable for existing references; the active provider is
# DeepSeek, called directly by src/services/llm.ts.
# ═══════════════════════════════════════════════════════════════

contract:
  name: llm_provider_integration
  version: "2.0.0"
  owner: l9-website-factory
  supersedes: "llm_router_integration@1.1.1"
  decision: docs/adr/ADR-0020-direct-deepseek-llm-provider.md
  adapter: src/services/llm.ts
  provider: deepseek
  endpoint: "https://api.deepseek.com/chat/completions"
  fallback_providers: []
  automatic_retries: 0
  automatic_model_escalation: false

models:
  default: deepseek-flash
  allowed:
    deepseek-flash: { vision: true }
    deepseek-v4-pro: { vision: false }
  pricing_basis: "verified peak USD rates per 1M tokens (2026-11-06); recorded cost is an upper bound"

# ─────────────────────────────────────────────────────────────
# TASK MAPPING (capability → DeepSeek request shape)
# ─────────────────────────────────────────────────────────────

task_mapping:
  content_generation:
    task_type: CONTENT_GENERATION
    adapter_method: generateContent
    thinking: disabled
    max_tokens: 3000
  design_intelligence:
    task_type: STRATEGIC_REASONING
    adapter_method: designReasoning
    thinking: enabled_low_effort
    response_format: json_object
    max_tokens: "1000 + DEEPSEEK_REASONING_TOKEN_ALLOWANCE"
  schema_generation:
    task_type: CODE_GENERATION
    adapter_method: generateSchema
    thinking: disabled
    max_tokens: 1500
  visual_qa:
    task_type: LAYOUT_VALIDATION
    adapter_method: validateLayout
    thinking: disabled
    response_format: json_object
    images: base64 data URLs (image_url parts)
    max_tokens: 800
    note: "Report contract unchanged; the verdict is not an authoritative design-quality gate."
  redesign_improve_ops:
    task_type: "per src/intelligence/improve-llm-policy.ts"
    adapter_method: strategize
    thinking: "enabled_low_effort when requiresReasoning"
  search_grounded:
    task_types: [COMPETITOR_RESEARCH, FACT_VERIFICATION, MARKET_RESEARCH, CITATION_CHECK, LINK_PROSPECTING]
    requires_search: true
    status: UNSUPPORTED_FAIL_CLOSED
    note: "No authorized retrieval capability backs the adapter; these never produce model-only claims."

# ─────────────────────────────────────────────────────────────
# SPENDING BOUNDARY (enforced before dispatch, per build)
# ─────────────────────────────────────────────────────────────

budget:
  scope: per_adapter_instance_one_build
  max_requests_per_build: { env: LLM_MAX_REQUESTS_PER_BUILD, default: 200 }
  build_allowance_usd: { env: LLM_BUILD_BUDGET_USD, default: 10 }
  max_input_tokens_per_call: { env: LLM_MAX_INPUT_TOKENS, default: 400000 }
  reasoning_token_allowance: { env: DEEPSEEK_REASONING_TOKEN_ALLOWANCE, default: 8192 }
  reservation: worst_case_cost_at_peak_rates_before_dispatch
  failed_dispatch_without_usage: reservation_stays_charged
  durability: BLOCKED_process_local_not_durable_across_workers_or_restarts

# ─────────────────────────────────────────────────────────────
# GOVERNANCE
# ─────────────────────────────────────────────────────────────

governance:
  never_invent:
    - phone numbers
    - email addresses
    - physical addresses
    - license numbers
    - credentials
    - certifications
    - legal claims
    - testimonials
  grounded_facts:
    - business claims and competitor data require authorized evidence inputs; the LLM adapter never verifies facts
  visual_qa_required:
    - before any production deployment
    - after major layout changes
    - when responsive breakpoints are modified

# ─────────────────────────────────────────────────────────────
# ENVIRONMENT VARIABLES
# ─────────────────────────────────────────────────────────────

env_vars:
  required:
    - DEEPSEEK_API_KEY
  optional:
    - CLIENT_ID
    - DEEPSEEK_MODEL
    - DEEPSEEK_BASE_URL
    - LLM_PROVIDER_TIMEOUT_MS
    - LLM_BUILD_BUDGET_USD
    - LLM_MAX_REQUESTS_PER_BUILD
    - LLM_MAX_INPUT_TOKENS
    - DEEPSEEK_REASONING_TOKEN_ALLOWANCE
  image_generation_only:
    - GEMINI_API_KEY
  retired:
    - OPENROUTER_API_KEY
    - PERPLEXITY_API_KEY
    - MONTHLY_BUDGET_PER_CLIENT
    - WEEKLY_BUDGET_TARGET
    - WEEKLY_BUDGET_HARD_CEILING
  install_only:
    # GitHub Packages read credential used by .npmrc during npm ci/install — NOT a runtime secret.
    - NODE_AUTH_TOKEN
